<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Task Manager Mejorado</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #eef1f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .task-input button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .task-input button:hover {
            background: #0056b3;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filters button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #ddd;
        }

        .filters button.active {
            background: #007bff;
            color: white;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        li.completed span {
            text-decoration: line-through;
            color: #777;
        }

        .actions button {
            margin-left: 5px;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .complete-btn {
            background: #28a745;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-all-btn {
            background: #6c757d;
            color: white;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .counter {
            text-align: center;
            margin-top: 10px;
            color: #555;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Task Manager Mejorado</h1>

    <!-- Entrada de nueva tarea -->
    <div class="task-input">
        <input id="taskInput" type="text" placeholder="Escribe una nueva tarea..." />
        <button id="addTaskBtn">Añadir</button>
    </div>

    <!-- Filtros -->
    <div class="filters">
        <button data-filter="all" class="active">Todas</button>
        <button data-filter="pending">Pendientes</button>
        <button data-filter="completed">Completadas</button>
    </div>

    <!-- Lista de tareas -->
    <ul id="taskList"></ul>
    <p id="emptyMsg" class="empty">No hay tareas. Añade una para empezar.</p>

    <!-- Contador -->
    <p class="counter" id="counter"></p>

    <!-- Borrar todas -->
    <button class="delete-all-btn" id="deleteAllBtn">Eliminar todas las tareas</button>
</div>

<script>
    const STORAGE_KEY = "tasks";
    const taskInput = document.getElementById("taskInput");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");
    const emptyMsg = document.getElementById("emptyMsg");
    const counter = document.getElementById("counter");
    const deleteAllBtn = document.getElementById("deleteAllBtn");
    const filterButtons = document.querySelectorAll(".filters button");

    let tasks = loadTasks();
    let currentFilter = "all";

    renderTasks();

    addTaskBtn.addEventListener("click", addTask);
    taskInput.addEventListener("keyup", e => e.key === "Enter" && addTask());
    deleteAllBtn.addEventListener("click", deleteAllTasks);

    filterButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            filterButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            renderTasks();
        });
    });

    function addTask() {
        const description = taskInput.value.trim();
        if (!description) return;

        tasks.push({ description, completed: false });
        saveTasks();
        renderTasks();
        taskInput.value = "";
        taskInput.focus();
    }

    function loadTasks() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }

    function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
        taskList.innerHTML = "";

        const filtered = tasks.filter(task => {
            if (currentFilter === "pending") return !task.completed;
            if (currentFilter === "completed") return task.completed;
            return true;
        });

        emptyMsg.style.display = filtered.length ? "none" : "block";

        filtered.forEach((task, index) => {
            const li = document.createElement("li");
            if (task.completed) li.classList.add("completed");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.addEventListener("change", () => toggleComplete(index));

            const span = document.createElement("span");
            span.textContent = task.description;

            const actions = document.createElement("div");
            actions.classList.add("actions");

            const completeBtn = document.createElement("button");
            completeBtn.textContent = "Completar";
            completeBtn.classList.add("complete-btn");
            completeBtn.addEventListener("click", () => toggleComplete(index));

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Eliminar";
            deleteBtn.classList.add("delete-btn");
            deleteBtn.addEventListener("click", () => deleteTask(index));

            actions.appendChild(completeBtn);
            actions.appendChild(deleteBtn);

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(actions);

            taskList.appendChild(li);
        });

        updateCounter();
    }

    function toggleComplete(index) {
        tasks[index].completed = !tasks[index].completed;
        saveTasks();
        renderTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
    }

    function deleteAllTasks() {
        if (confirm("¿Seguro que quieres eliminar TODAS las tareas?")) {
            tasks = [];
            saveTasks();
            renderTasks();
        }
    }

    function updateCounter() {
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed).length;
        const pending = total - completed;

        counter.textContent = `Total: ${total} | Pendientes: ${pending} | Completadas: ${completed}`;
    }
</script>
</body>
</html>
