<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .task-input button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .task-input button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        li span {
            flex: 1;
            margin-left: 8px;
        }

        li.completed span {
            text-decoration: line-through;
            color: #777;
        }

        .actions button {
            margin-left: 5px;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .complete-btn {
            background: #28a745;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Task Manager</h1>

    <!-- Entrada de nueva tarea -->
    <div class="task-input">
        <input id="taskInput" type="text" placeholder="Escribe una nueva tarea..." />
        <button id="addTaskBtn">Añadir</button>
    </div>

    <!-- Lista de tareas -->
    <ul id="taskList"></ul>
    <p id="emptyMsg" class="empty">No hay tareas. Añade una para empezar.</p>
</div>

<script>
    // Clave para localStorage
    const STORAGE_KEY = "tasks";

    // Referencias a elementos del DOM
    const taskInput = document.getElementById("taskInput");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");
    const emptyMsg = document.getElementById("emptyMsg");

    // Cargar tareas desde localStorage al iniciar
    let tasks = loadTasks();
    renderTasks();

    // Escuchar click en "Añadir"
    addTaskBtn.addEventListener("click", () => {
        const description = taskInput.value.trim();
        if (description === "") return;

        tasks.push({ description, completed: false });
        saveTasks();
        renderTasks();
        taskInput.value = "";
        taskInput.focus();
    });

    // Permitir Enter para añadir
    taskInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") {
            addTaskBtn.click();
        }
    });

    // Carga tareas desde localStorage
    function loadTasks() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    // Guarda tareas en localStorage
    function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // Renderiza la lista de tareas en el DOM
    function renderTasks() {
        taskList.innerHTML = "";

        if (tasks.length === 0) {
            emptyMsg.style.display = "block";
            return;
        } else {
            emptyMsg.style.display = "none";
        }

        tasks.forEach((task, index) => {
            const li = document.createElement("li");
            if (task.completed) li.classList.add("completed");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.addEventListener("change", () => toggleComplete(index));

            const span = document.createElement("span");
            span.textContent = task.description;

            const actions = document.createElement("div");
            actions.classList.add("actions");

            const completeBtn = document.createElement("button");
            completeBtn.textContent = "Completar";
            completeBtn.classList.add("complete-btn");
            completeBtn.addEventListener("click", () => toggleComplete(index));

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Eliminar";
            deleteBtn.classList.add("delete-btn");
            deleteBtn.addEventListener("click", () => deleteTask(index));

            actions.appendChild(completeBtn);
            actions.appendChild(deleteBtn);

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(actions);

            taskList.appendChild(li);
        });
    }

    // Marca/desmarca una tarea como completada
    function toggleComplete(index) {
        tasks[index].completed = !tasks[index].completed;
        saveTasks();
        renderTasks();
    }

    // Elimina una tarea
    function deleteTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
    }
</script>
</body>
</html>
